[workspace]
resolver = "2"
members = ["contracts/tipjar"]

[workspace.dependencies]
soroban-sdk = { version = "28.0.0" }

# Size-optimised profile for the on-chain WASM binary.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
panic_in_result_fn = "warn"
